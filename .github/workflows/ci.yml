name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Permessi minimi: la pipeline legge soltanto il codice.
permissions:
  contents: read

# Annulla run obsolete sullo stesso ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formattazione
        run: cargo fmt --all -- --check

      - name: Clippy (warning = errore)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (crypto in-memory + wire su socket reali)
        run: cargo test --all-targets --all-features

  docker:
    name: docker build (immagine portabile)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build immagine
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hydra-transit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test immagine (entrypoint --help)
        run: docker run --rm hydra-transit:ci --help
